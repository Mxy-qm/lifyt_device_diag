<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设备诊断 · LiFY-T device diag</title>
<style>
  :root{
    --bg:#f2f7f3; --card:#fff; --ink:#16321f; --muted:#5f7a68; --line:#d9e6dd;
    --brand:#2f7d5b; --brand-soft:#e3f3e9; --ok:#1f7a4d; --warn:#a96b00; --bad:#b3261e; --skip:#8a9a90;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .brand{font-weight:700;color:var(--brand);letter-spacing:.2px}
  .brand small{font-weight:500;color:var(--muted);margin-left:6px;font-size:.72rem}
  .grow{flex:1}
  .chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600;background:#fff}
  .chip.on{background:var(--brand-soft);border-color:#b8ddc7;color:var(--ok)}
  .chip.off{color:var(--bad);border-color:#f0c9c6;background:#fdf1f0}
  select,button,input,textarea{font:inherit;color:inherit}
  select{padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  main{max-width:940px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  h2{font-size:.95rem;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  button{cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600}
  button.ghost{background:#fff;color:var(--brand)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .verdict{border-radius:14px;padding:16px;color:#fff;display:flex;gap:14px;align-items:center}
  .verdict .big{font-size:1.5rem;font-weight:800;line-height:1.15}
  .verdict .sub{opacity:.92;font-size:.85rem}
  .verdict.pass{background:linear-gradient(135deg,#1f7a4d,#2f9c67)}
  .verdict.warn{background:linear-gradient(135deg,#a96b00,#c98a12)}
  .verdict.fail{background:linear-gradient(135deg,#a3271f,#c4392f)}
  .verdict.idle{background:linear-gradient(135deg,#4a5f52,#6a8073)}
  .badge{background:rgba(255,255,255,.2);border-radius:10px;padding:6px 10px;font-size:.78rem;text-align:center;min-width:64px}
  .badge b{display:block;font-size:1.1rem}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  td,th{padding:7px 6px;border-bottom:1px solid #eef4f0;text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.4px}
  td.v{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.84rem}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .dot.pass{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.fail{background:var(--bad)} .dot.skip{background:var(--skip)}
  .note{color:var(--muted);font-size:.8rem;margin-top:2px}
  .note.warn{color:var(--warn)} .note.fail{color:var(--bad)}
  details summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.88rem}
  #logbox{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:.76rem;background:#f7fbf8;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:320px;overflow:auto;margin-top:8px}
  .adv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .adv label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
  .adv input[type=text],.adv input[type=password],.adv input[type=number],.adv textarea,.adv select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
  .muted{color:var(--muted);font-size:.82rem}
  footer{max-width:940px;margin:0 auto;padding:0 14px 28px;color:var(--muted);font-size:.76rem}
  .banner{border:1px dashed #e0c9a6;background:#fffaf0;color:#7a5a12;border-radius:10px;padding:8px 10px;font-size:.8rem;margin-bottom:10px}
  @media(max-width:640px){.adv{grid-template-columns:1fr}.verdict .big{font-size:1.25rem}}
</style>
</head>
<body>
<header>
  <div class="brand"><span data-i18n="brand">设备诊断</span><small>LiFY-T</small></div>
  <span class="grow"></span>
  <span id="chip" class="chip off" data-i18n="notConnected">未连接</span>
  <select id="lang" aria-label="language">
    <option value="en">EN</option>
    <option value="zh">简</option>
    <option value="zhHant">繁</option>
  </select>
</header>

<main>
  <div class="banner" data-i18n="alphaBanner">Alpha 内测版：判定口径与文案可能变动，结论仅供内部参考。</div>

  <section class="card">
    <h2 data-i18n="connectTitle">第一步 · 连接设备</h2>
    <div class="row">
      <button id="btnRun" data-i18n="runCheck">连接并诊断</button>
      <button id="btnDisconnect" class="ghost" data-i18n="disconnect" disabled>断开</button>
    </div>
    <div class="muted" style="margin-top:8px" id="hint" data-i18n="connectHint">手机/电脑用 USB-TTL 接设备右上角 3 针（TXD/RXD/GND），插上后点上面的按钮。</div>
    <details style="margin-top:10px">
      <summary data-i18n="advTitle">高级（内部使用）</summary>
      <div class="adv" style="margin-top:10px">
        <div>
          <label for="pw" data-i18n="lblPassword">AT 密码（留空则跳过解锁）</label>
          <input id="pw" type="password" autocomplete="off" placeholder="••••••">
        </div>
        <div>
          <label for="baud" data-i18n="lblBaud">波特率</label>
          <select id="baud"><option value="0">自动（9600 → 115200）</option><option value="9600">9600</option><option value="115200">115200</option></select>
        </div>
        <div>
          <label for="reboot" data-i18n="lblReboot">重启采集完整启动信息（ATZ）</label>
          <select id="reboot"><option value="1" data-i18n="optYes">是（推荐）</option><option value="0" data-i18n="optNo">否</option></select>
        </div>
        <div>
          <label for="showIds" data-i18n="lblShowIds">显示完整序列号</label>
          <select id="showIds"><option value="0" data-i18n="optNo">否（脱敏）</option><option value="1" data-i18n="optYes">是</option></select>
        </div>
        <div style="grid-column:1/-1">
          <label for="profile" data-i18n="lblProfile">批次期望值（JSON，可选；填了就按期望值比对）</label>
          <textarea id="profile" placeholder='{"server":"1.2.3.4,5683","apn":"cmhk","cops":"45412","nband":"8","tdc":1800000,"stdc":1800000,"ctangle":10}'></textarea>
        </div>
      </div>
    </details>
  </section>

  <section class="card">
    <div id="verdict" class="verdict idle">
      <div>
        <div class="big" id="verdictText" data-i18n="idleVerdict">等待诊断</div>
        <div class="sub" id="verdictSub" data-i18n="idleSub">连上设备后会自动跑完一套固定检查</div>
      </div>
      <span class="grow"></span>
      <div class="badge"><b id="cntFail">0</b><span data-i18n="bFail">不通过</span></div>
      <div class="badge"><b id="cntWarn">0</b><span data-i18n="bWarn">提示</span></div>
      <div class="badge"><b id="cntPass">0</b><span data-i18n="bPass">通过</span></div>
    </div>
  </section>

  <section class="card" id="results">
    <h2 data-i18n="resultsTitle">检查结果</h2>
    <div id="resultsBody" class="muted" data-i18n="resultsEmpty">还没有结果。</div>
    <div class="row" style="margin-top:12px">
      <button id="btnCopy" class="ghost" data-i18n="copyReport" disabled>复制报告</button>
      <button id="btnDownload" class="ghost" data-i18n="downloadReport" disabled>下载报告</button>
    </div>
  </section>

  <details class="card">
    <summary data-i18n="rawTitle">原始串口日志</summary>
    <div class="row" style="margin-top:10px">
      <button id="btnCopyLog" class="ghost" data-i18n="copyLog" disabled>复制日志</button>
    </div>
    <div id="logbox"></div>
  </details>

  <details class="card">
    <summary data-i18n="replayTitle">回放模式（用已有日志验证判定）</summary>
    <div class="muted" style="margin:8px 0" data-i18n="replayHint">把设备日志粘进来，或用文件导入，走同一套解析与判定，不需要连硬件。</div>
    <input id="replayFile" type="file" accept=".txt,.log,.md">
    <textarea id="replayText" data-i18n-placeholder="replayPlaceholder" placeholder="粘贴设备串口日志…"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="btnReplay" class="ghost" data-i18n="runReplay">用这段日志诊断</button>
    </div>
  </details>
</main>

<footer>
  <div id="verLine"></div>
  <div data-i18n="footerNote">纯前端单页：不联网、不上传日志。判定规则见 docs/protocol-notes.md。</div>
</footer>

/* ---------------- state & helpers ---------------- */
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let lang = localStorage.getItem("dc.lang") || "en";
let port = null, writer = null, reader = null;
let connected = false, buffer = "", lineBuf = "", busy = false, lastResult = null;

function t(key) {
  const pack = T[lang] || T.en;
  return pack[key] !== undefined ? pack[key] : (T.en[key] !== undefined ? T.en[key] : key);
}
function tItem(id) {
  const pack = T[lang] || T.en;
  return (pack.item && pack.item[id]) || id;
}
function tGroup(id) {
  const pack = T[lang] || T.en;
  return (pack.group && pack.group[id]) || id;
}
function tNote(id, level) {
  const pack = T[lang] || T.en;
  return (pack.note && pack.note[id + "." + level]) || "";
}

function applyI18n() {
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang === "zhHant" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    if (T[lang] && T[lang][k] !== undefined) el.textContent = T[lang][k];
    else if (T.en[k] !== undefined) el.textContent = T.en[k];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    const k = el.getAttribute("data-i18n-placeholder");
    el.placeholder = (T[lang] && T[lang][k]) || T.en[k] || "";
  });
  const opts = $("reboot").querySelectorAll("option");
  opts[0].textContent = t("optYes");
  opts[1].textContent = t("optNo");
  const s2 = $("showIds").querySelectorAll("option");
  s2[0].textContent = t("optNo2");
  s2[1].textContent = t("optYes2");
  setChip(connected);
  if (lastResult) render(lastResult);
}

function setChip(on, pending) {
  const chip = $("chip");
  chip.classList.toggle("on", !!on);
  chip.classList.toggle("off", !on);
  chip.textContent = pending ? t("connecting") : on ? t("connected") : t("notConnected");
}

function logLine(s) {
  buffer += s + "\r\n";
  const box = $("logbox");
  box.textContent = buffer.length > 40000 ? buffer.slice(-40000) : buffer;
  box.scrollTop = box.scrollHeight;
}

/* ---------------- CH340 over WebUSB ---------------- */
const WCH_VID = 0x1a86, CH343_PID = 0x55d3;
const CH341_BAUDBASE_FACTOR = 1532620800, CH341_BAUDBASE_DIVMAX = 3;
const CH340_INIT = 0xa1, CH340_SET_BAUDRATE = 0x9a, CH340_SET_HANDSHAKE = 0xa4;
const VENDOR_CLASS = 0xff, MAX_TRANSFER_SIZE = 64;

function assertTransferOk(result, action) {
  if (result.status !== "ok") throw new Error("CH340 " + action + " failed: " + result.status);
}

class WebUSBSerialPort {
  constructor(usbDevice) {
    this.usbDevice = usbDevice; this.readable = null; this.writable = null;
    this.interfaceNumber = null; this.endpointIn = null; this.endpointOut = null;
    this.currentDtr = false; this.currentRts = false;
    this.controlQueue = Promise.resolve(); this.readLoopRunning = false;
  }
  getInfo() { return { usbVendorId: this.usbDevice.vendorId, usbProductId: this.usbDevice.productId }; }
  async open(options) {
    const baudRate = (options && options.baudRate) || 9600;
    if (this.usbDevice.opened) await this.close();
    await this.usbDevice.open();
    if (!this.usbDevice.configuration || this.usbDevice.configuration.configurationValue !== 1) {
      await this.usbDevice.selectConfiguration(1);
    }
    this.claimBulkInterface();
    if (this.interfaceNumber === null || this.endpointIn === null || this.endpointOut === null) {
      throw new Error("No CH340 vendor bulk IN/OUT interface found");
    }
    try { await this.usbDevice.claimInterface(this.interfaceNumber); }
    catch (e) { throw new Error("Unable to claim the CH340 USB interface. " + e); }
    await this.vendorOut(CH340_INIT, 0, 0);
    await this.setBaudRate(baudRate);
    await this.setSignals({ dataTerminalReady: false, requestToSend: false });
    this.createStreams();
  }
  async setBaudRate(baudRate) {
    let factor = Math.floor(CH341_BAUDBASE_FACTOR / baudRate);
    let divisor = CH341_BAUDBASE_DIVMAX;
    while (factor > 0xfff0 && divisor > 0) { factor >>= 3; divisor--; }
    if (factor > 0xfff0) throw new Error("Baudrate " + baudRate + " is not supported by CH340");
    factor = 0x10000 - factor;
    await this.vendorOut(CH340_SET_BAUDRATE, 0x1312, (factor & 0xff00) | divisor);
    await this.vendorOut(CH340_SET_BAUDRATE, 0x0f2c, factor & 0xff);
    await sleep(50);
  }
  async setSignals(signals) {
    if (signals.dataTerminalReady !== undefined) this.currentDtr = signals.dataTerminalReady;
    if (signals.requestToSend !== undefined) this.currentRts = signals.requestToSend;
    const value = ~((this.currentDtr ? 1 << 5 : 0) | (this.currentRts ? 1 << 6 : 0)) & 0xffff;
    await this.vendorOut(CH340_SET_HANDSHAKE, value, 0);
  }
  async close() {
    this.readLoopRunning = false; this.readable = null; this.writable = null;
    if (this.usbDevice.opened) {
      if (this.interfaceNumber !== null) { try { await this.usbDevice.releaseInterface(this.interfaceNumber); } catch (e) {} }
      await this.usbDevice.close();
    }
    this.interfaceNumber = null; this.endpointIn = null; this.endpointOut = null;
  }
  claimBulkInterface() {
    const config = this.usbDevice.configuration;
    if (!config) throw new Error("USB device has no configuration");
    for (const iface of config.interfaces) {
      for (const alt of iface.alternates) {
        if (alt.interfaceClass !== VENDOR_CLASS) continue;
        let inEp = null, outEp = null;
        for (const ep of alt.endpoints) {
          if (ep.type === "bulk" && ep.direction === "in") inEp = ep.endpointNumber;
          else if (ep.type === "bulk" && ep.direction === "out") outEp = ep.endpointNumber;
        }
        if (inEp !== null && outEp !== null) { this.interfaceNumber = iface.interfaceNumber; this.endpointIn = inEp; this.endpointOut = outEp; return; }
      }
    }
  }
  async vendorOut(request, value, index) {
    const self = this;
    const run = this.controlQueue.then(async () => {
      if (!self.usbDevice.opened) throw new Error("CH340 device is not open");
      const result = await self.usbDevice.controlTransferOut({ requestType: "vendor", recipient: "device", request, value, index });
      assertTransferOk(result, "control request 0x" + request.toString(16));
    });
    this.controlQueue = run.then(() => undefined, () => undefined);
    await run;
  }
  createStreams() {
    const self = this;
    const inEp = this.endpointIn, outEp = this.endpointOut;
    this.readLoopRunning = true;
    this.readable = new ReadableStream({
      pull: async (controller) => {
        while (self.readLoopRunning && self.usbDevice.opened) {
          try {
            const result = await self.usbDevice.transferIn(inEp, MAX_TRANSFER_SIZE);
            if (result.status === "stall") { await self.usbDevice.clearHalt("in", inEp); continue; }
            if (result.status === "ok" && result.data && result.data.byteLength > 0) {
              controller.enqueue(new Uint8Array(result.data.buffer, result.data.byteOffset, result.data.byteLength));
              return;
            }
          } catch (e) {
            if (!self.readLoopRunning || !self.usbDevice.opened) return;
            throw e;
          }
        }
      },
      cancel: () => { self.readLoopRunning = false; }
    });
    this.writable = new WritableStream({
      write: async (chunk) => {
        if (!self.usbDevice.opened) throw new Error("CH340 device is not open");
        const result = await self.usbDevice.transferOut(outEp, chunk);
        assertTransferOk(result, "bulk OUT");
      }
    });
  }
}

/* ---------------- 连接 ---------------- */
function explainError(e) {
  const name = (e && e.name) || "Error";
  const msg = (e && e.message) || String(e);
  if (name === "NotFoundError") return t("noDevice");
  if (name === "SecurityError") return "Access denied（接口被占用：关掉其它串口工具/旧标签页，拔插一次再试）";
  if (name === "NetworkError") return "NetworkError（USB 会话抖动：拔插一次再试）";
  return name + ": " + msg;
}

async function requestAdapter() {
  if (!navigator.usb) throw new Error("WebUSB 不可用（需要 Chrome/Edge，且 HTTPS 或 localhost）");
  const device = await navigator.usb.requestDevice({ filters: [{ vendorId: WCH_VID }] });
  const hasVendor = (device.configurations[0] || { interfaces: [] }).interfaces
    .some((i) => i.alternates.some((a) => a.interfaceClass === VENDOR_CLASS));
  if (device.productId === CH343_PID || !hasVendor) {
    if (navigator.serial) {
      const sp = await navigator.serial.requestPort();
      return { kind: "serial", port: sp };
    }
    throw new Error("这是 CDC 类适配器，当前版本请用桌面 Chrome 的 Web Serial，或换 CH340 适配器");
  }
  return { kind: "ch340", port: new WebUSBSerialPort(device) };
}

async function openPort(adapter, baudRate) {
  const p = adapter.port;
  const delays = [0, 400, 1200];
  let lastErr = null;
  for (let i = 0; i < delays.length; i++) {
    if (delays[i]) await sleep(delays[i]);
    try {
      await p.open({ baudRate: baudRate, dataBits: 8, stopBits: 1, parity: "none" });
      return;
    } catch (e) {
      lastErr = e;
      logLine("[open] 失败 " + (i + 1) + "/" + delays.length + ": " + ((e && e.name) || "") + " " + ((e && e.message) || e));
      if (!(e && e.name === "SecurityError")) break;
    }
  }
  throw lastErr;
}

function pipeRead(p) {
  (async () => {
    reader = p.readable.getReader();
    const dec = new TextDecoder();
    try {
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        const s = dec.decode(r.value, { stream: true });
        for (const ch of s) {
          if (ch === "\n" || ch === "\r") {
            if (lineBuf) {
              const line = lineBuf; lineBuf = "";
              if (!line.startsWith("TX> ")) logLine("← " + line);
            }
          } else lineBuf += ch;
        }
      }
    } catch (e) {
      if (connected) logLine("[read] 停止: " + ((e && e.message) || e));
    }
  })();
}

async function sendLine(line) {
  const payload = line + PROTOCOL.lineEnding;
  logLine("→ " + (line ? line : "<CRLF>"));
  await writer.write(new TextEncoder().encode(payload));
  await writer.ready;
}

async function teardown() {
  try { if (reader) await reader.cancel(); } catch (e) {}
  try { if (writer) writer.releaseLock(); } catch (e) {}
  try { if (port) await port.close(); } catch (e) {}
  reader = null; writer = null; port = null; connected = false;
  setChip(false);
  $("btnDisconnect").disabled = true;
}

/* ---------------- 诊断流程 ---------------- */
async function runSteps(steps) {
  for (const step of steps) {
    if (step.kind === "listen") { await sleep(step.ms); continue; }
    if (step.kind === "send") {
      const line = step.raw ? step.line : step.line;
      if (!step.raw && !isAllowedCommand(line)) { logLine("[skip] 剧本里出现非查询命令：" + line); continue; }
      try { await sendLine(line); } catch (e) { if (!step.bestEffort) throw e; logLine("[warn] 发送失败：" + line); }
      await sleep(step.waitMs || 500);
    }
  }
}

async function runCheck() {
  if (busy) return;
  busy = true;
  $("btnRun").disabled = true;
  buffer = ""; lineBuf = ""; lastResult = null;
  $("logbox").textContent = "";
  const password = $("pw").value.trim();
  const reboot = $("reboot").value === "1";
  const baudPref = Number($("baud").value || 0);
  const bauds = baudPref ? [baudPref] : PROTOCOL.baudCandidates;
  try {
    setChip(false, true);
    const adapter = await requestAdapter();
    port = adapter.port;
    for (const baud of bauds) {
      await openPort(adapter, baud);
      if (adapter.kind === "serial") {
        writer = port.writable.getWriter();
      } else {
        writer = port.writable.getWriter();
      }
      pipeRead(port);
      connected = true;
      setChip(true);
      $("btnDisconnect").disabled = false;
      logLine("[sys] 已连接 @" + baud);
      await runSteps([{ kind: "send", line: "", waitMs: 600 }]);
      if (buffer.replace(/→.*/g, "").trim().length > 0) break;
      // 9600 没反应 → 换波特率重试
      if (baud === bauds[bauds.length - 1]) break;
      await teardown();
      port = adapter.port;
    }
    const probe = buildProbeScript({ password: password });
    await runSteps(probe);
    const variant = detectVariant(buffer);
    logLine("[sys] 变体判定: " + variant);
    const plan = buildPlanScript(variant === "unknown" ? "nb" : variant, { password: password, reboot: reboot });
    await runSteps(plan);
    finalize();
  } catch (e) {
    logLine("[error] " + explainError(e));
    $("hint").textContent = explainError(e);
  } finally {
    busy = false;
    $("btnRun").disabled = false;
  }
}

function readProfile() {
  const raw = $("profile").value.trim();
  if (!raw) return {};
  try { return JSON.parse(raw); } catch (e) { logLine("[warn] 期望值 JSON 解析失败：" + ((e && e.message) || e)); return {}; }
}

function finalize() {
  if (!buffer.trim()) { $("hint").textContent = t("emptyLog"); return; }
  const report = parseConsole(buffer);
  const verdict = evaluate(report, { profile: readProfile() });
  lastResult = { report, verdict };
  render(lastResult);
}

/* ---------------- 渲染 ---------------- */
function render(res) {
  const { report, verdict } = res;
  const v = $("verdict");
  v.className = "verdict " + verdict.verdict;
  $("verdictText").textContent = verdict.verdict === "pass" ? t("vPass") : verdict.verdict === "warn" ? t("vWarn") : t("vFail");
  $("verdictSub").textContent = verdict.verdict === "pass" ? t("subPass") : verdict.verdict === "warn" ? t("subWarn") : t("subFail");
  $("cntFail").textContent = verdict.counts.fail || 0;
  $("cntWarn").textContent = verdict.counts.warn || 0;
  $("cntPass").textContent = verdict.counts.pass || 0;

  const showIds = $("showIds").value === "1";
  const body = $("resultsBody");
  body.innerHTML = "";
  for (const g of verdict.groups) {
    if (!g.items.length) continue;
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "14px";
    const h = document.createElement("h2");
    h.textContent = tGroup(g.id);
    wrap.appendChild(h);
    const table = document.createElement("table");
    const head = document.createElement("tr");
    head.innerHTML = "<th></th><th>" + (T[lang].note && T[lang].note.value ? T[lang].note.value : "actual") + "</th><th>" + (T[lang].note && T[lang].note.expected ? T[lang].note.expected : "expected") + "</th>";
    table.appendChild(head);
    for (const it of g.items) {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td");
      const dot = document.createElement("span");
      dot.className = "dot " + it.level;
      td1.appendChild(dot);
      td1.appendChild(document.createTextNode(tItem(it.id)));
      const note = tNote(it.id, it.level);
      if (note) {
        const n = document.createElement("div");
        n.className = "note " + (it.level === "fail" ? "fail" : it.level === "warn" ? "warn" : "");
        n.textContent = note;
        td1.appendChild(n);
      }
      const td2 = document.createElement("td");
      td2.className = "v";
      let val = it.value === null || it.value === undefined || it.value === "" ? "—" : String(it.value);
      if (it.masked && !showIds) val = maskValue(it.value);
      td2.textContent = val + (it.unit && it.value !== null ? " " + it.unit : "");
      const td3 = document.createElement("td");
      td3.className = "v";
      td3.textContent = it.expected !== undefined && it.expected !== null ? String(it.expected) : "";
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      table.appendChild(tr);
    }
    wrap.appendChild(table);
    body.appendChild(wrap);
  }
  if (!verdict.groups.some((g) => g.items.length)) body.textContent = t("resultsEmpty");
  $("btnCopy").disabled = false;
  $("btnDownload").disabled = false;
  $("btnCopyLog").disabled = buffer.trim().length === 0;
}

function reportText(res) {
  const { report, verdict } = res;
  const L = [
    "LiFY-T device diag " + APP_VERSION,
    new Date().toISOString(),
    "variant: " + report.variant + "  firmware: " + (report.firmware || "-"),
    "verdict: " + verdict.verdict.toUpperCase() + "  (fail=" + verdict.counts.fail + " warn=" + verdict.counts.warn + " pass=" + verdict.counts.pass + ")",
    ""
  ];
  for (const g of verdict.groups) {
    if (!g.items.length) continue;
    L.push("[" + tGroup(g.id) + "]");
    for (const it of g.items) {
      const val = it.masked ? maskValue(it.value) : it.value;
      L.push("  " + it.level.toUpperCase().padEnd(4) + " " + tItem(it.id) + ": " + (val === null || val === undefined ? "—" : val));
    }
    L.push("");
  }
  L.push("--- raw log ---", report.raw);
  return L.join("\n");
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    document.body.removeChild(ta);
  }
}

  URL.revokeObjectURL(a.href);
});

});

/* 演示/自测：?demo=1 载入内置健康日志；?demo=<文件名> 载入 tests/fixtures 下的文件 */

if (demo) {
  const file = demo === "1" ? "nb-healthy.txt" : demo;
  fetch("./tests/fixtures/" + file).then((r) => (r.ok ? r.text() : "")).then((txt) => {
    if (!txt) return;
    buffer = txt;
    $("logbox").textContent = txt;
    const report = parseConsole(txt);
    const verdict = evaluate(report, { profile: readProfile() });
    lastResult = { report, verdict };
    render(lastResult);
    document.title = "DEMO " + verdict.verdict + " · " + file;
  }).catch(() => {});
}
</script>
